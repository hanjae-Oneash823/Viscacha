# ============================================================
# Surveyor (Layer 2) configuration
# All thresholds, endpoints, and behavioral flags live here.
# No hardcoded values in module code.
# Paths are relative to the repository root (parent of layer2/).
# ============================================================

version: "2.1"

# Input paths (relative to repo root)
inputs:
  dtu_significant_csv: "outputs/layer1/dtu_significant_all_celltypes.csv"
  h5ad_path:           "outputs/layer0/filtered_adata/adata_tx_step03.h5ad"
  pseudobulk_dir:      "outputs/layer0/pseudobulk"
  gene_de_csv:         "outputs/layer1/gene_level_de_results.csv"   # optional (Layer 1 step15)

# Condition labels — must match Layer 0 AnnData exactly (note lowercase 'c' in Active control)
conditions:
  ad:             "AD"
  control:        "Control"
  active_control: "Active control"

# API endpoints
apis:
  ensembl:     "https://rest.ensembl.org"
  uniprot:     "https://rest.uniprot.org/uniprotkb"
  drugbank:    "https://api.drugbank.com/v1"          # requires API key — M04 deferred (Q1)
  chembl:      "https://www.ebi.ac.uk/chembl/api/data"
  opentargets: "https://api.platform.opentargets.org/api/v4/graphql"
  string:      "https://string-db.org/api"
  reactome:    "https://reactome.org/ContentService"
  gtex:        "https://gtexportal.org/api/v2"

# API authentication
auth:
  drugbank_api_key: "${DRUGBANK_API_KEY}"

# Thresholds
thresholds:
  string_confidence_high:             0.7
  string_confidence_moderate:         0.4
  string_min_partners_for_enrichment: 5
  chembl_potency_uM:                  1.0
  pdb_resolution_max_angstrom:        3.5
  splice_domain_proximity_residues:   15
  exon_overlap_min_fraction:          0.80
  gtex_expression_minimum_tpm:        1.0
  brain_specificity_enriched:         2.0
  brain_specificity_specific:         5.0
  cell_type_expression_min_cp10k:     1.0
  gene_de_log2fc_threshold:           0.5
  gene_de_padj_threshold:             0.05

# RDKit conformer generation (M04)
rdkit:
  random_seed:  42
  n_conformers: 100
  force_field:  "MMFF94"

# Tier assignment (derived in M03 from splice classification)
tier_assignment:
  tier1: ["A", "B"]
  tier2: ["C"]
  # Type D: no tier; routed to PPI surface analysis

# AD-relevant pathway list (M04, M06)
ad_pathways:
  - "amyloid precursor protein processing"
  - "tau protein phosphorylation"
  - "mitophagy"
  - "endosomal-lysosomal trafficking"
  - "neuroinflammation"
  - "axonal transport"
  - "synaptic plasticity"
  - "long-term potentiation"

# AD gene list (M06 interaction flagging)
ad_genes:
  - APP
  - PSEN1
  - PSEN2
  - APOE
  - TREM2
  - BIN1
  - CLU
  - CR1
  - PICALM
  - ABCA7
  - MAPT
  - SNCA
  - BACE1
  - ADAM10
  - GSK3B
  - CDK5
  - ADAM17
  - NCSTN
  - APH1A
  - PSENEN

# OpenTargets score labels (M05)
opentargets_labels:
  supported: 0.5
  emerging:  0.1

# Other neurodegenerative diseases for AD-specificity ratio (M05)
opentargets_efo:
  alzheimer:             "MONDO_0004975"
  parkinson:             "MONDO_0005180"
  frontotemporal:        "MONDO_0017276"
  als:                   "MONDO_0004976"

# Braak robustness
braak_robustness:
  affects_verdict:  false   # robust_to_braak=FALSE is a warning, not a failure
  checklist_symbol: "warning"

# Caching
cache:
  directory: "outputs/layer2/cache"
  ttl_days:
    ensembl:     90
    uniprot:     90
    drugbank:    14
    chembl:      30
    opentargets: 30
    string:      90
    reactome:    90
    gtex:        180
  force_refresh: false

# Concurrency
execution:
  max_parallel_modules:    4
  request_timeout_seconds:  30
  max_retries:              3
  retry_backoff_seconds:    5

# Output
output:
  base_dir:       "outputs/layer2"
  candidates_dir: "outputs/layer2/candidates"
  reports_dir:    "outputs/layer2/reports"
  alphafold_dir:  "outputs/layer2/alphafold"
  run_summary:    "outputs/layer2/surveyor_run_summary.md"
  audit_log:      "outputs/layer2/surveyor_audit.log"
